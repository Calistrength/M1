function showAchievements(){let completed=s.logs.filter(x=>x.completed),weeks=new Set(completed.map(x=>x.week)).size,days=new Set(completed.map(x=>x.week+'-'+x.day)).size;$('progress').innerHTML=`<div class="pageTitle"><h2>Achievements</h2></div><div class="achievementList"><div class="achievement"><strong>${completed.length}</strong>Exercises completed</div><div class="achievement"><strong>${days}</strong>Training days logged</div><div class="achievement"><strong>${weeks}</strong>Weeks active</div></div><button class="secondary full" type="button" id="backProgress">Open full progress dashboard</button>`;$('backProgress').onclick=()=>progress()}
function num(v){let n=parseFloat(v);return Number.isFinite(n)?n:0}function historyFor(id,beforeWeek){return s.logs.filter(r=>r.itemId===id&&r.completed&&r.week<beforeWeek).sort((a,b)=>a.week-b.week||String(a.updated||'').localeCompare(String(b.updated||'')))}function score(r,x){let reps1=num(r.a),reps2=num(r.b),load1=num(r.c),load2=num(r.d);if(x.unit==='kg'){let e1=load1*(1+reps1/30),e2=load2*(1+reps2/30);return Math.max(e1,e2)}return Math.max(reps1,reps2)}function suggestion(id,week){let x=item(id),h=historyFor(id,week);if(!h.length)return null;let last=h[h.length-1],prev=h.length>1?h[h.length-2]:null,a=num(last.a),b=num(last.b),c=num(last.c),d=num(last.d),txt='',vals={a,b,c,d};if(x.unit==='kg'){let maxRep=6,m=String(x.range||'').match(/(\d+)\s*-\s*(\d+)/);if(m)maxRep=+m[2];let step=Math.max(1,Math.round(Math.max(c,d)*.025/2.5)*2.5);let improved=!prev||score(last,x)>=score(prev,x)*.99;if(a>=maxRep&&b>=maxRep&&improved){vals={a:Math.max(3,maxRep-3),b:Math.max(3,maxRep-3),c:c+step,d:d+step};txt=`Progress load by ${step} kg` }else if(improved){vals={a:Math.min(maxRep,a+1),b:Math.min(maxRep,b+1),c,d};txt='Keep the load and add one rep where possible'}else{vals={a,b,c,d};txt='Repeat the previous session and prioritise recovery'}}else{let best=Math.max(a,b),old=prev?score(prev,x):0;if(prev&&best<old){vals={a,b,c:0,d:0};txt='Repeat the previous target; performance dipped'}else{vals={a:a+1,b:b+1,c:0,d:0};txt=`Aim to add 1 ${x.unit==='seconds'?'second':'rep'} per set`}}return {txt,vals,lastWeek:last.week}}function suggestedHtml(id,week){let z=suggestion(id,week);if(!z)return '';let x=item(id),v=z.vals,detail=x.unit==='kg'?`Set 1: ${v.c} kg × ${v.a} | Set 2: ${v.d} kg × ${v.b}`:`Set 1: ${v.a} ${x.unit} | Set 2: ${v.b} ${x.unit}`;return `<div class="suggest"><b>Suggested goal for Week ${week}</b><br><span class="small">Based on your most recent completed session in Week ${z.lastWeek}</span><br>${detail}<br><span class="small">${z.txt}. Guidance only; record what you actually complete.</span></div>`}function workout(openSlot=null){let d=s.days[currentDay];$('train').innerHTML=`<div class="trainDashboard"><div class="weekPanel"><div class="muted">CURRENT TRAINING WEEK</div><h2>Week ${s.week} of 8</h2><select id="trainWeek">${[1,2,3,4,5,6,7,8].map(w=>`<option value="${w}" ${w===s.week?'selected':''}>Week ${w}</option>`).join('')}</select></div><div class="dayPicker">${s.days.map((x,i)=>`<button type="button" class="dayPick ${i===currentDay?'selected':''}" data-day="${i}">Day ${i+1}<small>${esc(x.name.replace(/^Day \d+ /,''))}</small></button>`).join('')}</div></div><div class="trainToolbar row spread"><div class="pageTitle"><h2>${d.name}</h2></div><select id="day" style="width:105px">${s.days.map((x,i)=>`<option value="${i}" ${i===currentDay?'selected':''}>Day ${i+1}</option>`).join('')}</select></div>${d.slots.map((id,i)=>{let x=item(id),v=s.logs.find(r=>r.week===s.week&&r.day===currentDay&&r.slot===i)||{};return `<details class="card trainCard ${v.completed?'done':''}" draggable="true" data-i="${i}" ${openSlot===i?'open':''}><summary><span><span class="orderNo">${i+1}</span>${esc(x.name)}</span><span class="exerciseMeta">${v.completed?'Completed':'Tap to open'}</span></summary><div class="movebar"><span class="dragHandle">☰ Drag to relocate</span><button type="button" class="trainUp secondary" data-i="${i}">↑</button><button type="button" class="trainDown secondary" data-i="${i}">↓</button></div><label>Training item</label><select class="slotItem" data-i="${i}">${options(id)}</select><div class="target">Target: ${target(x)}</div>${suggestedHtml(id,s.week)}<div class="muted">Benchmark ${x.benchmark} ${x.unit} • ${x.benchmarkType} • ${x.low}-${x.high}%</div><div class="grid"><div><label>Set 1 reps / sec</label><input id="a${i}" value="${esc(v.a)}"></div><div><label>Set 2 reps / sec</label><input id="b${i}" value="${esc(v.b)}"></div><div><label>Load set 1</label><input id="c${i}" value="${esc(v.c)}"></div><div><label>Load set 2</label><input id="d${i}" value="${esc(v.d)}"></div></div><label>Notes</label><textarea id="n${i}">${esc(v.notes)}</textarea><label><input type="checkbox" id="done${i}" style="width:auto" ${v.completed?'checked':''}> Completed</label><button type="button" class="saveLog full" data-i="${i}">Save exercise</button><button type="button" class="removeSlot danger" data-i="${i}">Remove exercise from this day</button></details>`}).join('')}<button type="button" id="addSlot" class="secondary full">Add exercise slot to this day</button><button type="button" id="resetDay" class="danger full">Reset this training day</button>`;$('trainWeek').onchange=e=>{s.week=+e.target.value;saveState();home();workout();progress()};document.querySelectorAll('.dayPick').forEach(x=>x.onclick=()=>{currentDay=+x.dataset.day;workout()});$('day').onchange=e=>{currentDay=+e.target.value;workout()};document.querySelectorAll('.slotItem').forEach(x=>x.onchange=()=>{d.slots[+x.dataset.i]=x.value;persist();workout(+x.dataset.i)});document.querySelectorAll('.saveLog').forEach(x=>x.onclick=()=>log(+x.dataset.i));document.querySelectorAll('.removeSlot').forEach(x=>x.onclick=()=>{let i=+x.dataset.i;if(!confirm('Remove this exercise from the training day?'))return;d.slots.splice(i,1);s.logs=s.logs.filter(r=>!(r.day===currentDay&&r.slot===i)).map(r=>r.day===currentDay&&r.slot>i?{...r,slot:r.slot-1}:r);persist();workout()});function moveSlot(from,to){if(to<0||to>=d.slots.length||from===to)return;let order=d.slots.map((_,i)=>i),[oldIndex]=order.splice(from,1);order.splice(to,0,oldIndex);let map={};order.forEach((oldPos,newPos)=>map[oldPos]=newPos);let [moved]=d.slots.splice(from,1);d.slots.splice(to,0,moved);s.logs=s.logs.map(r=>r.day===currentDay&&Object.prototype.hasOwnProperty.call(map,r.slot)?{...r,slot:map[r.slot]}:r);saveState();workout(to);home();progress()}document.querySelectorAll('.trainUp').forEach(el=>el.onclick=e=>{e.preventDefault();moveSlot(+el.dataset.i,+el.dataset.i-1)});document.querySelectorAll('.trainDown').forEach(el=>el.onclick=e=>{e.preventDefault();moveSlot(+el.dataset.i,+el.dataset.i+1)});let dragFrom=null;document.querySelectorAll('.trainCard').forEach(card=>{card.ondragstart=e=>{if(e.target.closest('input,select,textarea,button')){e.preventDefault();return}dragFrom=+card.dataset.i;card.classList.add('dragging');e.dataTransfer.effectAllowed='move'};card.ondragend=()=>card.classList.remove('dragging');card.ondragover=e=>{e.preventDefault();e.dataTransfer.dropEffect='move'};card.ondrop=e=>{e.preventDefault();let to=+card.dataset.i;if(dragFrom!==null)moveSlot(dragFrom,to);dragFrom=null}});$('addSlot').onclick=()=>{d.slots.push(s.items[0].id);saveState();workout(d.slots.length-1);home();progress()};$('resetDay').onclick=()=>{if(!confirm('Reset this training day for the current week? This clears all saved entries and completion ticks for this day.'))return;s.logs=s.logs.filter(r=>!(r.week===s.week&&r.day===currentDay));persist();workout()}}function log(i){let idx=s.logs.findIndex(x=>x.week===s.week&&x.day===currentDay&&x.slot===i),r={week:s.week,day:currentDay,slot:i,itemId:s.days[currentDay].slots[i],a:$('a'+i).value,b:$('b'+i).value,c:$('c'+i).value,d:$('d'+i).value,notes:$('n'+i).value,completed:$('done'+i).checked,updated:new Date().toISOString()};idx<0?s.logs.push(r):s.logs[idx]=r;persist();workout(i)}function progress(){let selected=s.progressItem&&s.items.some(x=>x.id===s.progressItem)?s.progressItem:(s.items[0]&&s.items[0].id);s.progressItem=selected;let completed=s.logs.filter(x=>x.completed),days=new Set(completed.map(x=>x.week+'-'+x.day)).size,sets=completed.reduce((n,r)=>n+(String(r.a||'').trim()?1:0)+(String(r.b||'').trim()?1:0),0);let weekly=[1,2,3,4,5,6,7,8].map(w=>{let ls=completed.filter(x=>x.week===w),ds=new Set(ls.map(x=>x.day)).size,st=ls.reduce((n,r)=>n+(String(r.a||'').trim()?1:0)+(String(r.b||'').trim()?1:0),0);return {w,c:ls.length,d:ds,st}});let x=item(selected),ih=completed.filter(r=>r.itemId===selected).sort((a,b)=>a.week-b.week),rows=ih.map(r=>`<div class="card"><b>Week ${r.week}</b><div>${x.unit==='kg'?`Set 1: ${esc(r.c)} kg × ${esc(r.a)} | Set 2: ${esc(r.d)} kg × ${esc(r.b)}`:`Set 1: ${esc(r.a)} ${esc(x.unit)} | Set 2: ${esc(r.b)} ${esc(x.unit)}`}</div><div class="muted">Performance score: ${score(r,x).toFixed(1)}</div></div>`).join('')||'<div class="card muted">No completed history for this exercise yet.</div>';$('progress').innerHTML=`<div class="pageTitle"><h2>Progress dashboard</h2></div><div class="statgrid"><div class="stat"><strong>${completed.length}</strong>Exercises completed</div><div class="stat"><strong>${days}</strong>Training days</div><div class="stat"><strong>${sets}</strong>Sets recorded</div><div class="stat"><strong>${new Set(completed.map(r=>r.week)).size}</strong>Weeks trained</div></div><h3>Weekly activity</h3>${weekly.map(q=>`<div class="card row spread"><b>Week ${q.w}</b><span>${q.c} exercises · ${q.d} days · ${q.st} sets</span></div>`).join('')}<h3>Exercise trend</h3><select id="progressItem">${options(selected)}</select><div class="card"><canvas id="trendChart" width="640" height="240"></canvas><div class="muted">Weighted exercises use estimated 1RM (Epley). Reps and holds use the best completed set.</div></div>${suggestedHtml(selected,Math.min(8,(Math.max(0,...ih.map(r=>r.week))+1)))}${rows}`;$('progressItem').onchange=e=>{s.progressItem=e.target.value;saveState();progress()};setTimeout(()=>drawTrend(selected),0)}function drawTrend(id){let cv=$('trendChart');if(!cv)return;let ctx=cv.getContext('2d'),x=item(id),pts=[1,2,3,4,5,6,7,8].map(w=>{let rs=s.logs.filter(r=>r.completed&&r.itemId===id&&r.week===w);return rs.length?Math.max(...rs.map(r=>score(r,x))):null});ctx.clearRect(0,0,cv.width,cv.height);ctx.strokeStyle='#263955';ctx.fillStyle='#9fb0c5';ctx.font='12px sans-serif';for(let i=0;i<8;i++){let px=45+i*82;ctx.beginPath();ctx.moveTo(px,18);ctx.lineTo(px,205);ctx.stroke();ctx.fillText('W'+(i+1),px-8,225)}let vals=pts.filter(v=>v!==null),max=Math.max(1,...vals)*1.1,min=Math.min(0,...vals);ctx.strokeStyle='#62e6a7';ctx.lineWidth=3;ctx.beginPath();let begun=false;pts.forEach((v,i)=>{if(v===null)return;let px=45+i*82,py=195-(v-min)/(max-min)*165;if(!begun){ctx.moveTo(px,py);begun=true}else ctx.lineTo(px,py);ctx.fillStyle='#62e6a7';ctx.fillRect(px-4,py-4,8,8);ctx.fillStyle='#f4f7fb';ctx.fillText(v.toFixed(1),px-12,py-10)});ctx.stroke()}function setup(){let units=['kg','reps','seconds','max hold'];$('setup').innerHTML=`<div class="card setupCard"><h2>Your name</h2><label for="athleteName">Your name</label><input id="athleteName" type="text" autocomplete="name" placeholder="Enter your name" value="${esc(s.athleteName||'')}"></div><div class="pageTitle"><h2>Training item database</h2></div><div class="status">Heavy and light versions are separate items with independent percentages and working ranges.</div><button id="newItem" type="button" class="full">Create new training item</button><div style="height:10px"></div>${s.items.map((x,i)=>`<details class="card setupCard" draggable="true" data-i="${i}"><summary>${esc(x.name||'Untitled training item')}</summary><div class="movebar"><span class="dragHandle">☰ Drag to relocate</span><button type="button" class="moveUp secondary" data-i="${i}">↑</button><button type="button" class="moveDown secondary" data-i="${i}">↓</button></div><label>Training item name</label><input class="name" data-i="${i}" value="${esc(x.name)}"><div class="grid"><div><label>Benchmark</label><input class="benchmark" data-i="${i}" inputmode="decimal" value="${x.benchmark}"></div><div><label>Unit</label><select class="unit" data-i="${i}">${units.map(u=>`<option ${u===x.unit?'selected':''}>${u}</option>`).join('')}</select></div><div><label>Low %</label><input class="low" data-i="${i}" inputmode="decimal" value="${x.low}"></div><div><label>High %</label><input class="high" data-i="${i}" inputmode="decimal" value="${x.high}"></div><div><label>Benchmark type</label><input class="type" data-i="${i}" value="${esc(x.benchmarkType
