<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#071321">
<title>Calisthenics V9.8</title>
<style>
:root{--b:#07111f;--c:#101d31;--l:#2d4566;--t:#f4f7fb;--m:#a9bad0;--a:#62e6a7;--blue:#63a9ff;--purple:#a985ff;--orange:#ffad66;--page:#63a9ff;--page2:#a985ff}*{box-sizing:border-box}html,body{overflow-x:hidden;-webkit-overflow-scrolling:touch}body{margin:0;color:var(--t);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding-bottom:calc(82px + env(safe-area-inset-bottom));background:radial-gradient(circle at 12% 0%,#174f78 0,transparent 34%),radial-gradient(circle at 92% 8%,#51458f 0,transparent 31%),linear-gradient(155deg,#081728,#0d2136 52%,#111b38);background-attachment:fixed}body.theme-home{--page:#63a9ff;--page2:#a985ff}body.theme-train{--page:#62e6a7;--page2:#23b879}body.theme-progress{--page:#a985ff;--page2:#6f7dff}body.theme-setup{--page:#ffad66;--page2:#ff704d}header{padding:20px max(18px,calc((100% - 1180px)/2));position:sticky;top:0;background:#071321e8;backdrop-filter:blur(14px);border-bottom:1px solid color-mix(in srgb,var(--page) 55%,#263955);z-index:3}h1{margin:0;font-size:23px}.sub,.muted{color:var(--m);font-size:13px}.screen{display:none;padding:20px;max-width:1180px;margin:auto}.screen.active{display:block}.card{background:var(--c);border:1px solid var(--l);border-radius:16px;padding:14px;margin-bottom:12px}.row{display:flex;gap:9px;align-items:center}.spread{justify-content:space-between}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}input,select,textarea{width:100%;padding:10px;border:1px solid #38506e;border-radius:10px;background:#091627;color:#fff;font-size:15px}label{display:block;color:var(--m);font-size:12px;margin:7px 0 4px}button{padding:11px 13px;border:0;border-radius:11px;background:var(--a);color:#062018;font-weight:800;cursor:pointer}.secondary{background:#16263d;color:#fff;border:1px solid var(--l)}.danger{background:#963747;color:#fff}.full{width:100%;margin-top:10px}.status{color:var(--a);background:#102c28;padding:10px;border-radius:10px;margin-bottom:12px}nav{position:fixed;bottom:0;left:0;right:0;display:grid;grid-template-columns:repeat(4,1fr);background:#081220;padding:7px 5px calc(7px + env(safe-area-inset-bottom));border-top:1px solid var(--l);z-index:9999;transform:translateZ(0)}nav button{background:none;color:var(--m);font-size:12px}.navon{color:var(--page)!important;text-shadow:0 0 14px color-mix(in srgb,var(--page) 55%,transparent)}
.hero{min-height:390px;border-radius:20px;padding:38px;margin-bottom:14px;display:flex;align-items:center;position:relative;overflow:hidden;background-image:linear-gradient(90deg,rgba(4,15,29,.93) 0%,rgba(4,15,29,.70) 38%,rgba(4,15,29,.08) 72%),url("hero-desktop.png");background-size:cover;background-position:center 42%;box-shadow:0 22px 60px #0008,0 0 35px #63a9ff18;border:1px solid #69abff99}.heroContent{position:relative;z-index:1;width:min(520px,100%)}.heroEyebrow{color:var(--page);letter-spacing:.14em;font-weight:900;font-size:12px}.hero h2{font-size:48px;line-height:1.02;margin:8px 0;color:#fff}.hero h2 span{display:block;color:#63a9ff}.heroLead{font-size:18px;line-height:1.55;color:#dbe9f8;max-width:430px;margin:24px 0}.heroRule{height:3px;width:110px;background:linear-gradient(90deg,#63a9ff,transparent);margin:20px 0}.heroPills{display:flex;gap:12px;flex-wrap:wrap}.heroPill{padding:9px 13px;border:1px solid #ffffff26;background:#06111fb8;border-radius:99px;font-size:12px;color:#e9f4ff}.heroPill b{color:#62e6a7}.homeStatus{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:15px 18px;margin:16px 0;background:linear-gradient(90deg,#073629cc,#092538cc);border:1px solid #24b97988;border-radius:15px}.homeStatus strong{color:#62e6a7}.homeStatus button{background:#0c513d;color:#dffff1;border:1px solid #62e6a7}.actionGrid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.actionCard{min-height:220px;display:flex;flex-direction:column;border-radius:18px;padding:20px;background:#0b1b2dd9;border:1px solid var(--accent)}.actionIcon{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;font-size:25px;background:color-mix(in srgb,var(--accent) 18%,#081321);border:1px solid var(--accent);color:var(--accent)}.actionCard h3{font-size:20px;color:var(--accent);margin:16px 0 6px}.actionCard p{color:#c6d4e5;line-height:1.45;margin:0 0 18px}.actionCard button{margin-top:auto;width:100%;color:#fff;background:color-mix(in srgb,var(--accent) 65%,#10233b);border:1px solid var(--accent)}.trainBlue{--accent:#3b9cff}.progressGreen{--accent:#36d486}.achievementPurple{--accent:#a86cff}.setupOrange{--accent:#ff8a32}.dayPicker{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin-bottom:14px}.dayPick{background:#132b45;color:#eaf4ff;border:1px solid #315778}.dayPick.selected{background:linear-gradient(135deg,#176bca,#2054a8);border-color:#67b3ff}.trainCard{border-left:4px solid var(--page)}.trainCard summary,.setupCard summary{font-weight:800;cursor:pointer;list-style:none}.target{font-weight:800;color:var(--page);font-size:18px;margin:8px 0}.done{border-color:#2b996d;background:#102c28}.statgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.stat{background:#091627;border:1px solid var(--l);border-radius:12px;padding:10px}.stat strong{display:block;font-size:19px;color:var(--page)}
@media(max-width:850px){.actionGrid{grid-template-columns:1fr 1fr}.hero{min-height:340px}.hero h2{font-size:40px}.statgrid{grid-template-columns:1fr 1fr}}
@media(max-width:520px){.screen{padding:13px}.hero{min-height:460px;padding:22px;align-items:center;background-image:linear-gradient(180deg,rgba(4,15,29,.68) 0%,rgba(4,15,29,.52) 55%,rgba(4,15,29,.82) 100%),url("hero-mobile.png");background-position:center center}.hero h2{font-size:36px}.heroLead{font-size:15px;max-width:100%}.heroPills{display:none}.actionGrid{grid-template-columns:1fr}.actionCard{min-height:180px}.homeStatus{align-items:flex-start;flex-direction:column}.dayPicker{grid-template-columns:1fr 1fr}.grid{grid-template-columns:1fr}.sub{font-size:12px}}
</style>
</head>
<body class="theme-home">
<header><h1>Calisthenics Strength</h1><div class="sub">Build Strength. Move Better. Be Consistent. • Version 9.8</div></header>
<main><section id="home" class="screen active"></section><section id="train" class="screen"></section><section id="progress" class="screen"></section><section id="setup" class="screen"></section></main>
<nav><button data-p="home" class="navon">Home</button><button data-p="train">Train</button><button data-p="progress">Progress</button><button data-p="setup">Setup</button></nav>
<script>
'use strict';
const DEFAULT_ITEMS=[{id:'planche',name:'Planche Practice',benchmark:15,unit:'seconds',low:80,high:100},{id:'hspu',name:'Handstand Press-ups',benchmark:6,unit:'reps',low:80,high:100},{id:'muscle',name:'Muscle-ups',benchmark:5,unit:'reps',low:80,high:100},{id:'bench',name:'Bench Press - Heavy',benchmark:100,unit:'kg',low:80,high:85},{id:'dips',name:'Weighted Dips - Heavy',benchmark:45,unit:'kg',low:90,high:100},{id:'front',name:'Front Lever - Heavy',benchmark:15,unit:'seconds',low:80,high:100},{id:'rear',name:'Back/Rear Lever - Heavy',benchmark:15,unit:'seconds',low:80,high:100},{id:'pullups',name:'Pull-ups',benchmark:25,unit:'reps',low:70,high:100}];
const DEFAULT_DAYS=[{name:'Day 1 Push Strength',slots:['planche','hspu','muscle','bench','dips']},{name:'Day 2 Pull Strength',slots:['front','rear','pullups']},{name:'Day 3 Push Volume',slots:['planche','hspu','dips']},{name:'Day 4 Pull Volume',slots:['front','rear','pullups']}];
const $=id=>document.getElementById(id),esc=v=>{const d=document.createElement('div');d.textContent=String(v??'');return d.innerHTML};
let s;try{s=JSON.parse(localStorage.getItem('calV9'))||JSON.parse(localStorage.getItem('calV8'))}catch(e){}if(!s||!Array.isArray(s.items)||!Array.isArray(s.days))s={week:1,athleteName:'',items:DEFAULT_ITEMS,days:DEFAULT_DAYS,logs:[]};if(typeof s.athleteName!=='string')s.athleteName='';let currentDay=0;const save=()=>localStorage.setItem('calV9',JSON.stringify(s));
function page(p){document.body.className='theme-'+p;document.querySelectorAll('.screen').forEach(x=>x.classList.toggle('active',x.id===p));document.querySelectorAll('nav button').forEach(x=>x.classList.toggle('navon',x.dataset.p===p));scrollTo(0,0)}document.querySelectorAll('nav button').forEach(x=>x.onclick=()=>page(x.dataset.p));
function item(id){return s.items.find(x=>x.id===id)||s.items[0]}function target(x){return `${Math.round((+x.benchmark||0)*(+x.low||0)/100)}-${Math.round((+x.benchmark||0)*(+x.high||0)/100)} ${x.unit||''}`}
function home(){const done=s.logs.filter(x=>x.completed&&x.week===s.week).length,pct=Math.min(100,Math.round(((s.week-1)/8)*100));$('home').innerHTML=`<div class="hero"><div class="heroContent"><div class="heroEyebrow">CALISTHENICS V9.8</div><h2>Welcome back,<span>${esc(s.athleteName.trim()||'Athlete')}!</span></h2><div class="heroRule"></div><div class="heroLead">Build strength through consistency. Every rep, every session, every week moves you forward.</div><div class="heroPills"><div class="heroPill"><b>●</b> Stay consistent</div><div class="heroPill"><b>●</b> Progressive overload</div><div class="heroPill"><b>●</b> Trust the process</div></div></div></div><div class="homeStatus"><div><strong>${done?'Great work. Keep the momentum going.':'Week '+s.week+' is ready when you are.'}</strong><div class="muted">${pct}% through the current 8-week cycle · ${done} exercises completed this week</div></div><button data-go="progress">View progress</button></div><div class="actionGrid"><div class="actionCard trainBlue"><div class="actionIcon">◆</div><h3>TRAIN</h3><p>Select a training day and record each exercise.</p><button data-go="train">Start Workout</button></div><div class="actionCard progressGreen"><div class="actionIcon">↗</div><h3>PROGRESS</h3><p>Review completed exercises and weekly activity.</p><button data-go="progress">View Progress</button></div><div class="actionCard achievementPurple"><div class="actionIcon">★</div><h3>ACHIEVEMENTS</h3><p>See training consistency at a glance.</p><button data-go="progress">View Achievements</button></div><div class="actionCard setupOrange"><div class="actionIcon">≡</div><h3>SETUP</h3><p>Manage your name, exercises and programme.</p><button data-go="setup">Edit Program</button></div></div>`;document.querySelectorAll('[data-go]').forEach(x=>x.onclick=()=>page(x.dataset.go))}
function workout(){const d=s.days[currentDay];$('train').innerHTML=`<h2>Week ${s.week} of 8</h2><label>Training week</label><select id="week">${[1,2,3,4,5,6,7,8].map(w=>`<option ${w===s.week?'selected':''}>${w}</option>`).join('')}</select><div class="dayPicker">${s.days.map((x,i)=>`<button class="dayPick ${i===currentDay?'selected':''}" data-day="${i}">${esc(x.name)}</button>`).join('')}</div><h2>${esc(d.name)}</h2>${d.slots.map((id,i)=>{const x=item(id),v=s.logs.find(r=>r.week===s.week&&r.day===currentDay&&r.slot===i)||{};return `<details class="card trainCard ${v.completed?'done':''}"><summary>${i+1}. ${esc(x.name)}</summary><div class="target">Target: ${target(x)}</div><div class="grid"><div><label>Set 1 reps / sec</label><input id="a${i}" value="${esc(v.a||'')}"></div><div><label>Set 2 reps / sec</label><input id="b${i}" value="${esc(v.b||'')}"></div><div><label>Load set 1</label><input id="c${i}" value="${esc(v.c||'')}"></div><div><label>Load set 2</label><input id="d${i}" value="${esc(v.d||'')}"></div></div><label>Notes</label><textarea id="n${i}">${esc(v.notes||'')}</textarea><label><input type="checkbox" id="done${i}" style="width:auto" ${v.completed?'checked':''}> Completed</label><button class="full saveLog" data-i="${i}">Save exercise</button></details>`}).join('')}`;$('week').onchange=e=>{s.week=+e.target.value;save();render()};document.querySelectorAll('[data-day]').forEach(x=>x.onclick=()=>{currentDay=+x.dataset.day;workout()});document.querySelectorAll('.saveLog').forEach(x=>x.onclick=()=>{const i=+x.dataset.i,idx=s.logs.findIndex(r=>r.week===s.week&&r.day===currentDay&&r.slot===i),r={week:s.week,day:currentDay,slot:i,itemId:d.slots[i],a:$('a'+i).value,b:$('b'+i).value,c:$('c'+i).value,d:$('d'+i).value,notes:$('n'+i).value,completed:$('done'+i).checked,updated:new Date().toISOString()};idx<0?s.logs.push(r):s.logs[idx]=r;save();render()})}
function progress(){const completed=s.logs.filter(x=>x.completed),days=new Set(completed.map(x=>x.week+'-'+x.day)).size,sets=completed.reduce((n,r)=>n+(r.a?1:0)+(r.b?1:0),0);$('progress').innerHTML=`<h2>Progress dashboard</h2><div class="statgrid"><div class="stat"><strong>${completed.length}</strong>Exercises completed</div><div class="stat"><strong>${days}</strong>Training days</div><div class="stat"><strong>${sets}</strong>Sets recorded</div><div class="stat"><strong>${new Set(completed.map(x=>x.week)).size}</strong>Weeks trained</div></div><h3>Weekly activity</h3>${[1,2,3,4,5,6,7,8].map(w=>`<div class="card row spread"><b>Week ${w}</b><span>${completed.filter(x=>x.week===w).length} exercises</span></div>`).join('')}`}
function setup(){$('setup').innerHTML=`<div class="card"><h2>Your name</h2><label>Your name</label><input id="athleteName" value="${esc(s.athleteName)}" placeholder="Enter your name"></div><h2>Training item database</h2>${s.items.map((x,i)=>`<details class="card setupCard"><summary>${esc(x.name)}</summary><label>Name</label><input class="nm" data-i="${i}" value="${esc(x.name)}"><div class="grid"><div><label>Benchmark</label><input class="bm" data-i="${i}" value="${x.benchmark}"></div><div><label>Unit</label><select class="un" data-i="${i}"><option ${x.unit==='kg'?'selected':''}>kg</option><option ${x.unit==='reps'?'selected':''}>reps</option><option ${x.unit==='seconds'?'selected':''}>seconds</option></select></div><div><label>Low %</label><input class="lo" data-i="${i}" value="${x.low}"></div><div><label>High %</label><input class="hi" data-i="${i}" value="${x.high}"></div></div></details>`).join('')}`;$('athleteName').onchange=e=>{s.athleteName=e.target.value.trim();save();home()};document.querySelectorAll('.nm,.bm,.un,.lo,.hi').forEach(el=>el.onchange=()=>{const x=s.items[+el.dataset.i],map={nm:'name',bm:'benchmark',un:'unit',lo:'low',hi:'high'},k=map[el.className];x[k]=['benchmark','low','high'].includes(k)?+el.value:el.value;save();render()})}
function render(){home();workout();progress();setup()}render();
</script>
</body>
</html>
